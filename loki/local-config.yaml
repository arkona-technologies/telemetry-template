auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Add the retention limit here
limits_config:
  retention_period: ${RETENTION_PERIOD} # Uses env var, defaults to 31 days
# Enforce maximum memory cap per query to prevent runaway LogQL queries
  max_query_length: 721h                     # Cap query window (e.g. 30 days)
  max_query_parallelism: 16                  # Prevent massive parallel query allocations

ingester:
  chunk_idle_period: 15m                    # How long a chunk can sit idle in RAM before flushing to disk
  max_chunk_age: 2h                         # Force flush chunk to disk after 2 hours
  chunk_target_size: 1572864                 # Target chunk size in RAM (~1.5MB)

# Add the Compactor configuration
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

schema_config:
  configs:
    - from: "2020-10-24"
      index:
        period: 24h
        prefix: index_
      object_store: filesystem
      schema: v13 # Updated from v11
      store: tsdb   # Updated from boltdb-shipper for better performance