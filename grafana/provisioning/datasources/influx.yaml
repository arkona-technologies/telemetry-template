apiVersion: 1

datasources:
  - name: ${PV_DB_NAME}
    type: influxdb
    access: proxy
    url: http://influxdb:8181          # Standard container-to-container port for Influx 3
    editable: true
    isDefault: true
    uid: "influx3-flightsql"
    jsonData:
      version: "SQL"                   # Toggles native SQL processing language
      dbName: ${PV_DB_NAME}            # Targeted database name
      insecureGrpc: true               # CRUCIAL: Disables gRPC TLS wrapper enforcement
      tlsSkipVerify: true              # Standard HTTP layer bypass fallback
      httpHeaderName1: "Authorization"
    secureJsonData:
      token: ${PV_DB_TOKEN}            # Clear token value (now correctly prefixed with apiv3_)
      httpHeaderValue1: "Bearer ${PV_DB_TOKEN}"
