networks:
  telemetry:

services:
# influxDB
  influxdb:
    image: influxdb:3-core
    restart: always
    hostname: ${HOSTNAME:-telemetry-host}
    networks:
      - telemetry
    ports:
      - '8086:8181'
    volumes:
      - ./influxdb3/data:/root/.influxdb 
      - ./influxdb3/auth:/etc/influxdb3/auth:ro
    command:
      - influxdb3
      - serve
      - --node-id=${HOSTNAME:-telemetry-node} # Interpolated by compose on the host side
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
    environment:
      - INFLUXDB3_PERMISSION_TOKENS_FILE=/etc/influxdb3/auth/tokens.json
      # CLI tools config
      - INFLUX_HOST=http://localhost:8181
      - INFLUX_TOKEN=${DB_TOKEN}
      - INFLUX_DATABASE=${DB_NAME}
# grafana
  grafana:
    image: grafana/grafana-oss:12.4.2
    restart: always
    networks:
      - telemetry
    ports:
      - '3000:3000'
    depends_on:
      - influxdb
    volumes:
      - ./grafana/var/:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PW}
      - PV_DB_NAME=${DB_NAME}
      - PV_DB_PASSWORD=${DB_PASSWORD}
      - PV_DB_USER=${DB_USER}
      - PV_DB_TOKEN=${DB_TOKEN}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=100ms
      - GF_FEATURE_TOGGLES_ENABLE=canvasPanelPanZoom
# loki for logs
  loki:
    image: grafana/loki:2.9.0
    restart: always
    user: "10001"
    ports:
      - "3100:3100" #if changed, also change in loki&alloy configs
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - RETENTION_PERIOD=${RETENTION_PERIOD:-720h}
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - ./loki/data:/loki
    networks:
      - telemetry
# Grafana Alloy replacing Promtail
  alloy:
    image: grafana/alloy:v1.17.1 # Use the latest stable version
    restart: always
    group_add:
      - '${ADM_GID:-4}'       # 'adm' group
      - '${JOURNAL_GID:-101}'  # 'systemd-journal' group
    ports:
      - "12345:12345"
      - "1514:1514"
    volumes:
      - /var/log:/var/log:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/data:/var/lib/alloy/data # Alloy's data/positions directory
    command: 
      - run 
      - --server.http.listen-addr=0.0.0.0:12345 
      - --storage.path=/var/lib/alloy/data 
      - /etc/alloy/config.alloy
# vtelemetry
  vtelemetry:
    image: arkonatechnologies/vtelemetry2
    restart: always
    networks:
      - telemetry
    depends_on:
      - influxdb
    environment:
      - MACHINES=${BLADES}
      - BLACKLIST=\.audio\.signals,\.output\.signals,\.user_labels,\.monitoring_objects\.audio,software_update,audio_source_slices,peak_meter
      - WHITELIST=p_t_p,genlock,system
      - INFLUX_API=2
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_HOST=influxdb
      - DB_TOKEN=${DB_TOKEN}
      - VERBOSITY=1
      - MAX_MACHINES_PER_WORKER=4
