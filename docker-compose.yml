networks:
  telemetry:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
# influxDB
  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    restart: always
    logging: *default-logging
    hostname: ${HOSTNAME:-telemetry-host}
    networks:
      - telemetry
    ports:
      - '8086:8181'
    volumes:
      - ./influxdb3/data:/home/influxdb3/.influxdb3 
      - ./influxdb3/auth:/etc/influxdb3/auth:ro
    command:
      - influxdb3
      - serve
      - --node-id=${HOSTNAME:-telemetry-node} # Interpolated by compose on the host side
      - --object-store=file
      - --data-dir=/home/influxdb3/.influxdb3
      - --http-bind=0.0.0.0:8181
    environment:
      - INFLUXDB3_ADMIN_TOKEN_FILE=/etc/influxdb3/auth/admin-token.json
      - INFLUXDB3_HOST=http://127.0.0.1:8181
      - INFLUXDB3_AUTH_TOKEN=${DB_TOKEN}
      - INFLUXDB3_MAX_MEMORY_BYTES=${INFLUX3_MAX_MEMORY_BYTES}
      - INFLUXDB3_QUERY_MEMORY_POOL_BYTES=${INFLUX3_QUERY_MEMORY_POOL_BYTES}
      - INFLUXDB3_SINGLE_QUERY_MEMORY_LIMIT_BYTES=${INFLUX3_SINGLE_QUERY_MEMORY_LIMIT_BYTES}
    deploy:
      resources:
        limits:
          memory: ${INFLUX_CONTAINER_MEM_LIMIT:-0}
        reservations:
          memory: 2G
# grafana
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    logging: *default-logging
    networks:
      - telemetry
    ports:
      - '3000:3000'
    depends_on:
      - influxdb
    volumes:
      - ./grafana/var/:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PW}
      - PV_DB_NAME=${DB_NAME}
      - PV_DB_PASSWORD=${DB_PASSWORD}
      - PV_DB_USER=${DB_USER}
      - PV_DB_TOKEN=${DB_TOKEN}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=100ms
      - GF_FEATURE_TOGGLES_ENABLE=canvasPanelPanZoom
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-0}
# loki for logs
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    restart: always
    logging: *default-logging
    user: "10001"
    ports:
      - "3100:3100" #if changed, also change in loki&alloy configs
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - RETENTION_PERIOD=${RETENTION_PERIOD:-720h}
      - GOMEMLIMIT=${LOKI_GOMEMLIMIT}
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - ./loki/data:/loki
    networks:
      - telemetry
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEM_LIMIT:-0}
        reservations:
          memory: 512M
# Grafana Alloy
  alloy:
    image: grafana/alloy:v1.17.1 # Use the latest stable version
    container_name: alloy
    restart: always
    logging: *default-logging
    networks:
      - telemetry
    group_add:
      - '${ADM_GID:-4}'       # 'adm' group
      - '${JOURNAL_GID:-101}'  # 'systemd-journal' group
    ports:
      - "1514:1514"
      # - "12345:12345"                             # optional debug UI
    volumes:
      - /var/log:/var/log:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/data:/var/lib/alloy/data # Alloy's data/positions directory
    deploy:
      resources:
        limits:
          memory: ${ALLOY_MEM_LIMIT:-0}
    command: 
      - run 
      - --server.http.listen-addr=0.0.0.0:12345 
      - --storage.path=/var/lib/alloy/data 
      - /etc/alloy/config.alloy
# vtelemetry
  vtelemetry:
    image: arkonatechnologies/vtelemetry2
    container_name: vtelemetry
    restart: always
    logging: *default-logging
    networks:
      - telemetry
    depends_on:
      - influxdb
    environment:
      - MACHINES=${BLADES}
      - BLACKLIST=\.audio\.signals,\.output\.signals,\.user_labels,\.monitoring_objects\.audio,software_update,audio_source_slices,peak_meter
      - WHITELIST=p_t_p,genlock,system
      - INFLUX_API=2                                        # 1 | 2
      - DB_NAME=${DB_NAME}
      - DB_BUCKET=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_HOST=influxdb
      - DB_TOKEN=${DB_TOKEN}
      - DB_ORG=${DB_ORG}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - VERBOSITY=1                                         # 1 | 2 | 3
      - MAX_MACHINES_PER_WORKER=4
      - POLL=non-floats # nothing | non-floats | everything  # default nothing       
      - POLL_INTERVAL_MS=30000                             # default 100           
      # - SUBMISSION_TIMEOUT_MS=15000                       # default 15000         
      # - SENDS_PER_POLL=100                                # default 100           
      # - DEBOUNCE_MS=1000                                  # default 1000          
      # - MIN_DEBOUNCE_MS=100                               # default 100           
      # - MAX_DEBOUNCE_MS=60000                             # default 60000         
      # - VAPI_USER=                                        #
      # - VAPI_PASSWORD=                                    #
