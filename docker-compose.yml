networks:
  telemetry:

services:
# influxDB
  influxdb:
    image: docker.io/influxdb:2
    restart: always
    networks:
      - telemetry
    ports:
      - '8086:8086'
    volumes:
      - ./influxdb2:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DB_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${DB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DB_NAME}
      - V1_DB_NAME=v1-${DB_NAME}
      - V1_RP_NAME=v1-rp
      - V1_AUTH_USERNAME=${DB_USER}
      - V1_AUTH_PASSWORD=${DB_PASSWORD}
      - INFLUXD_STORAGE_WRITE_TIMEOUT=20s
      - INFLUXD_HTTP_WRITE_TIMEOUT=20s
# grafana
  grafana:
    image: grafana/grafana-oss:12.4.2
    restart: always
    networks:
      - telemetry
    ports:
      - '3000:3000'
    depends_on:
      - influxdb
    volumes:
      - ./grafana/var/:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PW}
      - PV_DB_NAME=${DB_NAME}
      - PV_DB_PASSWORD=${DB_PASSWORD}
      - PV_DB_USER=${DB_USER}
      - PV_DB_TOKEN=${DB_TOKEN}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=100ms
      - GF_FEATURE_TOGGLES_ENABLE=canvasPanelPanZoom
# loki for logs
  loki:
    image: grafana/loki:2.9.0
    restart: always
    user: "10001"
    ports:
      - "3100:3100" #if changed, also change in loki&promtail configs
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - RETENTION_PERIOD=${RETENTION_PERIOD:-720h}
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - ./loki/data:/loki
    networks:
      - telemetry
# promtail for loki
  promtail:
    image: grafana/promtail:2.9.0
    restart: always
    group_add:
      - '${ADM_GID:-4}'      # 'adm' group (Debian/Ubuntu /var/log access)
      - '${JOURNAL_GID:-101}' # 'systemd-journal' group access
    network_mode: host
    volumes:
      - /var/log:/var/log:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - ./promtail/positions.yaml:/tmp/positions.yaml # Ensure file exists on host first
    command: -config.file=/etc/promtail/config.yml
# vtelemetry
  vtelemetry:
    image: arkonatechnologies/vtelemetry2
    restart: always
    networks:
      - telemetry
    depends_on:
      - influxdb
    environment:
      - MACHINES=${BLADES}
      - BLACKLIST=\.audio\.signals,\.output\.signals,\.user_labels,\.monitoring_objects\.audio,software_update,audio_source_slices,peak_meter
      - WHITELIST=p_t_p,genlock,system
      - INFLUX_API=2
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_HOST=influxdb
      - DB_BUCKET=${DB_NAME}
      - DB_ORG=${DB_ORG}
      - DB_TOKEN=${DB_TOKEN}
      - VERBOSITY=1
      - MAX_MACHINES_PER_WORKER=4
